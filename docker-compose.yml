# metaxisdata demo -- the platform, the databases it collects from, and the one-shot
# containers that prepare them.
#
#   cp .env.example .env      (or just `make up`, which copies it for you)
#   make up                   start the stack
#   make logs                 follow it
#   make reset                drop everything, including volumes, and start over
#
# Every credential in this file is a throwaway local demo value.
name: metaxisdata-demo

# Shared by the Airflow containers. Airflow keeps its metadata in its own database on the
# store server, and reaches the demo databases through connection URIs that are spelled with
# exactly the same host and port the platform registered.
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${STORE_USER:-demo}:${STORE_PASSWORD:-demo}@metadata-db:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # A known UI login for the walkthrough (Airflow's simple auth manager).
  AIRFLOW__SIMPLE_AUTH_MANAGER__USERS: ${AIRFLOW_ADMIN_USER:-admin}:${AIRFLOW_ADMIN_PASSWORD:-admin}
  AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_PORT:-8080}
  AIRFLOW_CONN_SHOP_MYSQL: mysql://${DEMO_USER:-demo}:${DEMO_PASSWORD:-demo}@${MYSQL_HOST:-mysql-shop}:${MYSQL_PORT:-3306}/${MYSQL_DB:-shop}
  AIRFLOW_CONN_WAREHOUSE_POSTGRES: postgres://${DEMO_USER:-demo}:${DEMO_PASSWORD:-demo}@${PG_HOST:-postgres-warehouse}:${PG_PORT:-5432}/${PG_DB:-warehouse}
  AIRFLOW_CONN_SERVING_STARROCKS: mysql://root:@${SR_HOST:-starrocks-serving}:${SR_PORT:-9030}/ods
  # The DAGs read these to spell their OpenLineage dataset names the same way.
  MYSQL_HOST: ${MYSQL_HOST:-mysql-shop}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_DB: ${MYSQL_DB:-shop}
  PG_HOST: ${PG_HOST:-postgres-warehouse}
  PG_PORT: ${PG_PORT:-5432}
  PG_DB: ${PG_DB:-warehouse}
  SR_HOST: ${SR_HOST:-starrocks-serving}
  SR_PORT: ${SR_PORT:-9030}
  FIXTURE_DIR: /fixture
  PYTHONPATH: /opt/demo/airflow_plugins
  TZ: ${TZ:-UTC}

services:
  # --- platform -----------------------------------------------------------------

  # The platform's own metadata store. Not published: only metaxisdata needs it.
  metadata-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${STORE_USER:-demo}
      POSTGRES_PASSWORD: ${STORE_PASSWORD:-demo}
      POSTGRES_DB: ${STORE_DB:-metaxisdata}
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
      # Creates Airflow's own database. Runs only on an empty data directory.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORE_USER:-demo} -d ${STORE_DB:-metaxisdata}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The platform itself. The image embeds the web UI, so this is the only port a user
  # needs to open. Its schema is migrated on start-up.
  metaxisdata:
    image: ghcr.io/ranxy/metaxisdata:${METAXISDATA_VERSION:-v0.1.2}
    environment:
      PG_URL: postgres://${STORE_USER:-demo}:${STORE_PASSWORD:-demo}@metadata-db:5432/${STORE_DB:-metaxisdata}?sslmode=disable
      METAXISDATA_JSON_LOGGING: "true"
      TZ: ${TZ:-UTC}
    ports:
      - "${METAXISDATA_PORT:-8083}:8083"
    depends_on:
      metadata-db:
        condition: service_healthy
    restart: unless-stopped

  # --- collected databases ------------------------------------------------------

  # The shop's OLTP database. Seeded from fixture/mysql on first start.
  mysql-shop:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo-root}
      MYSQL_DATABASE: ${MYSQL_DB:-shop}
      # The account the platform collects with, and that the pipeline reads from.
      MYSQL_USER: ${DEMO_USER:-demo}
      MYSQL_PASSWORD: ${DEMO_PASSWORD:-demo}
    volumes:
      - mysql-shop-data:/var/lib/mysql
      # Runs once, on an empty data directory, in filename order.
      - ./fixture/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # The warehouse: landing (ods), transformation (dwd) and serving (ads) layers.
  postgres-warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DEMO_USER:-demo}
      POSTGRES_PASSWORD: ${DEMO_PASSWORD:-demo}
      POSTGRES_DB: ${PG_DB:-warehouse}
    volumes:
      - postgres-warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEMO_USER:-demo} -d ${PG_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The serving layer. The all-in-one image runs a frontend and a backend together and
  # wants roughly 4 GB to itself, so the memory limit is explicit.
  starrocks-serving:
    image: starrocks/allin1-ubuntu:4.1-latest
    mem_limit: 4g
    volumes:
      - starrocks-serving-data:/data/deploy/starrocks
    healthcheck:
      test: ["CMD-SHELL", "/data/deploy/health_check.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  # --- one-shot preparation -----------------------------------------------------
  #
  # Both use stock images that already ship the client they need, so the demo needs no
  # custom image and no package downloads at build time. Both are idempotent, so `make up`
  # may re-run them at any time.

  # Creates the warehouse schemas.
  warehouse-init:
    image: postgres:16-alpine
    command: []
    environment:
      PGHOST: ${PG_HOST:-postgres-warehouse}
      PGUSER: ${DEMO_USER:-demo}
      PGPASSWORD: ${DEMO_PASSWORD:-demo}
      PGDATABASE: ${PG_DB:-warehouse}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/warehouse_init.sh"]
    depends_on:
      postgres-warehouse:
        condition: service_healthy
    restart: "no"

  # Creates the StarRocks landing tables, views and async materialized view. StarRocks
  # speaks the MySQL protocol, so a plain mysql client is enough.
  serving-init:
    image: mysql:8.4
    command: []
    environment:
      SR_HOST: ${SR_HOST:-starrocks-serving}
      SR_PORT: ${SR_PORT:-9030}
    volumes:
      - ./fixture:/fixture:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/serving_init.sh"]
    depends_on:
      starrocks-serving:
        condition: service_healthy
    restart: "no"

  # Creates the demo's platform state: the administrator account, the three instances, a
  # full metadata sync, and the OpenLineage ingestion key that the Airflow container waits
  # for. Idempotent, and it uses only the Python standard library.
  bootstrap:
    image: python:3.12-alpine
    command: []
    environment:
      METAXISDATA_URL: http://metaxisdata:8083
      STATE_DIR: /state
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@demo.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Demo-admin-1234!}
      DEMO_USER: ${DEMO_USER:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      MYSQL_HOST: ${MYSQL_HOST:-mysql-shop}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB:-shop}
      PG_HOST: ${PG_HOST:-postgres-warehouse}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-warehouse}
      SR_HOST: ${SR_HOST:-starrocks-serving}
      SR_PORT: ${SR_PORT:-9030}
    volumes:
      - ./scripts:/scripts:ro
      - demo-state:/state
    entrypoint: ["python3", "/scripts/bootstrap.py"]
    depends_on:
      metaxisdata:
        condition: service_healthy
      warehouse-init:
        condition: service_completed_successfully
      serving-init:
        condition: service_completed_successfully
    restart: "no"

  # --- pipeline -----------------------------------------------------------------

  # One standalone Airflow: webserver, scheduler and triggerer in a single container. It
  # waits for the ingestion key the bootstrap container wrote before it starts, because
  # OpenLineage ingestion is key-gated and a missing key would make every event fail with
  # 401 while the DAGs still looked green.
  airflow:
    image: metaxisdata-demo/airflow:local
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    environment:
      <<: *airflow-env
      STATE_DIR: /state
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/plugins:/opt/demo/airflow_plugins:ro
      - ./fixture:/fixture:ro
      - demo-state:/state:ro
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    entrypoint: ["/bin/bash", "/opt/demo/entrypoint-airflow.sh"]
    depends_on:
      metadata-db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      # Airflow 3 serves its health check from the API server, not from /health.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  # Triggers the four DAGs in order and waits for each. It shares the Airflow image, so it
  # talks to the same metadata database and needs no API token.
  etl-runner:
    image: metaxisdata-demo/airflow:local
    command: []
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/plugins:/opt/demo/airflow_plugins:ro
      - ./fixture:/fixture:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/etl_runner.sh"]
    depends_on:
      airflow:
        condition: service_healthy
    restart: "no"

  # `make evolve` runs this: it adds one column to the shop's orders table, and the Makefile
  # then re-syncs so the platform notices. Kept behind a profile so `up` does not start it.
  schema-evolve:
    image: mysql:8.4
    command: []
    profiles: ["tools"]
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql-shop}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB:-shop}
      DEMO_USER: ${DEMO_USER:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/evolve.sh"]
    depends_on:
      mysql-shop:
        condition: service_healthy
    restart: "no"

  # Optional (`--profile ol`): a producer that is not Airflow, so the namespace-mapping story
  # can be shown. `make ol-demo` runs it twice: once unmapped, then again after creating the
  # mapping that binds the namespace to an instance.
  ol-producer:
    image: python:3.12-alpine
    command: []
    profiles: ["ol"]
    environment:
      METAXISDATA_URL: http://metaxisdata:8083
      STATE_DIR: /state
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@demo.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Demo-admin-1234!}
    volumes:
      - ./scripts:/scripts:ro
      - demo-state:/state:ro
    entrypoint: ["python3", "/scripts/emit_openlineage.py"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: "no"

volumes:
  metadata-db-data:
  mysql-shop-data:
  postgres-warehouse-data:
  starrocks-serving-data:
  demo-state:
